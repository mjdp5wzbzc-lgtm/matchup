name: Mise à jour des données

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
    - cron: "*/30 21-23,0-3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collecte (ESPN + lignes)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_MARKETS: ${{ vars.ODDS_MARKETS || 'player_points' }}
          HISTORY_SEASONS: ${{ vars.HISTORY_SEASONS || '2' }}
        run: python scripts/fetch.py

      - name: Analyse
        run: python scripts/analyze.py

      - name: Sauvegarde du cache dans le dépôt
        run: |
          git config user.name "matchup-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p data
          git add data
          git diff --cached --quiet || git commit -m "Données $(date -u +'%Y-%m-%d %H:%M')"
          git push || (git pull --rebase && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
